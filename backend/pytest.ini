[pytest]
testpaths = tests
python_files = test_*.py
; faulthandler выключен намеренно: рендер через COM штатно ловит структурные
; исключения Windows (мёртвый прокси PowerPoint), и их дампы забивают вывод,
; хотя ошибка обработана и тест проходит.
addopts = -q -p no:faulthandler
filterwarnings =
    ignore::DeprecationWarning
